name: Bug
description: Something is broken or behaves incorrectly
type: Bug
labels: ["needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include exact error messages. Never paste tokens or passwords.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
