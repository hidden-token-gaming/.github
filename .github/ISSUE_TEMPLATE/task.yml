name: Task
description: A specific, well-scoped piece of work (docs and chores included)
type: Task
labels: ["needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent epic (optional)
      placeholder: "#1"
