# This repository's own PR checks: the org's one-job PR hygiene (pr.yml, .github#47).
name: pr-checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

# A newer event on the same PR replaces a run still going, so a superseded run stops billing.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: ./.github/workflows/pr.yml
