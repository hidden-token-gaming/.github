# Reusable: the PR title must be a Conventional Commit with a lower-case subject.
# Call from a repository with:
#   jobs:
#     title:
#       uses: hidden-token-gaming/.github/.github/workflows/pr-title.yml@main
name: pr-title

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            chore
            ci
            build
            test
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a lower-case letter.
